    <!-- Core Database & Execution Engine -->

            { id: 55, name: "Toilet Cleaner 5 Litre", category: "Chemicals", price: 460, image: "images/toilet_cleaner_5litre.jpg" },
            { id: 56, name: "Toilet Cleaner Applicator", category: "Brushes", price: 150, image: "images/toilet_cleaner_applicator.jpg" },
            { id: 57, name: "Cleaning Trolley", category: "Cleaning Tools", price: 1299, image: "images/trolley.jpg" },
            { id: 58, name: "Urinal Brush", category: "Brushes", price: 89, image: "images/urinal_brush.jpg" },
            { id: 59, name: "Wet Floor Sign", category: "Cleaning Tools", price: 250, image: "images/wet_floor_sign.jpg" },
            { id: 60, name: "White Phenyl 5 Litre", category: "Chemicals", price: 460, image: "images/white_phenyl_5litre.jpg" },
            { id: 61, name: "Window Wiper", category: "Brushes", price: 210, image: "images/window_wiper.jpg" }
        ];

        let cartState = {};
        let activeCategory = 'All';

        function renderProducts(query = '', category = 'All') {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = '';
            
            let filtered = productsDatabase.filter(item => {
                let matchesSearch = item.name.toLowerCase().includes(query.toLowerCase());
                let matchesCategory = (category === 'All' || item.category === category);
                return matchesSearch && matchesCategory;
            });

            document.getElementById('product-count').innerText = filtered.length;

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-16 text-slate-500 font-semibold text-sm">माफ़ कीजिए, इस नाम से कोई उत्पाद नहीं मिला।</div>`;
                return;
            }

            filtered.forEach(product => {
                let currentQty = cartState[product.id] ? cartState[product.id].qty : 0;
                grid.innerHTML += `
                    <div class="bg-slate-800/90 rounded-2xl p-3 border border-slate-700/80 flex flex-col justify-between shadow-xl hover:border-emerald-500/50 transition-all">
                        <div>
                            <div class="relative bg-slate-900 rounded-xl overflow-hidden h-36 mb-3 flex items-center justify-center border border-slate-700/60">
                                <img src="${product.image}" alt="${product.name}" class="w-full h-full object-cover" onerror="this.src='images/harshit-chemical-them.jpg'">
                            </div>
                            <h4 class="font-bold text-xs text-slate-100 line-clamp-2 h-8 leading-snug">${product.name}</h4>
                            <p class="text-[10px] text-emerald-400 font-bold mt-1 uppercase tracking-wider">${product.category}</p>
                        </div>
                        <div class="mt-3 pt-2.5 border-t border-slate-700/60">
                            <div class="flex items-center justify-between mb-2">
                                <span class="font-black text-sm text-white">₹${product.price}</span>
                            </div>
                            ${currentQty === 0 ? `
                                <button onclick="modifyCart(${product.id}, 1)" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs py-2.5 rounded-xl shadow-md transition-all active:scale-95">
                                    जोड़ें (Add)
                                </button>
                            ` : `
                                <div class="flex items-center justify-between bg-emerald-600 text-white rounded-xl px-2.5 py-1.5 shadow-md">
                                    <button onclick="modifyCart(${product.id}, -1)" class="font-black text-sm px-1.5 hover:bg-emerald-700 rounded">-</button>
                                    <span class="text-xs font-black">${currentQty}</span>
                                    <button onclick="modifyCart(${product.id}, 1)" class="font-black text-sm px-1.5 hover:bg-emerald-700 rounded">+</button>
                                </div>
                            `}
                        </div>
                    </div>
                `;
            });
        }

        function handleSearch() {
            let query = document.getElementById('search-input').value;
            renderProducts(query, activeCategory);
        }

        function filterCategory(cat) {
            activeCategory = cat;
            let buttons = document.querySelectorAll('.category-btn');
            buttons.forEach(btn => {
                btn.classList.remove('bg-emerald-600', 'text-white', 'shadow-md');
                btn.classList.add('bg-slate-800', 'text-slate-300', 'border', 'border-slate-700');
            });
            event.target.classList.remove('bg-slate-800', 'text-slate-300', 'border', 'border-slate-700');
            event.target.classList.add('bg-emerald-600', 'text-white', 'shadow-md');
            renderProducts(document.getElementById('search-input').value, activeCategory);
        }

        function modifyCart(id, change) {
            let product = productsDatabase.find(p => p.id === id);
            if (!cartState[id]) {
                if (change > 0) cartState[id] = { ...product, qty: 1 };
            } else {
                cartState[id].qty += change;
                if (cartState[id].qty <= 0) delete cartState[id];
            }
            updateCartDisplay();
            renderProducts(document.getElementById('search-input').value, activeCategory);
        }

        function updateCartDisplay() {
            let totalCount = 0, totalPrice = 0;
            let container = document.getElementById('cart-items');
            container.innerHTML = '';

            let keys = Object.keys(cartState);
            keys.forEach(id => {
                let item = cartState[id];
                totalCount += item.qty;
                totalPrice += item.price * item.qty;

                container.innerHTML += `
                    <div class="flex items-center justify-between bg-slate-800/90 p-2.5 rounded-2xl border border-slate-700">
                        <div class="flex items-center space-x-3">
                            <img src="${item.image}" class="w-11 h-11 object-cover rounded-xl border border-slate-700" onerror="this.src='images/harshit-chemical-them.jpg'">
                            <div>
                                <h5 class="text-xs font-bold text-slate-200 line-clamp-1">${item.name}</h5>
                                <p class="text-[11px] text-emerald-400 font-semibold">₹${item.price} × ${item.qty}</p>
                            </div>
                        </div>
                        <div class="flex items-center space-x-2 bg-slate-900 border border-slate-700 px-2.5 py-1 rounded-xl">
                            <button onclick="modifyCart(${item.id}, -1)" class="text-slate-300 font-bold text-xs">-</button>
                            <span class="text-xs font-bold text-white">${item.qty}</span>
                            <button onclick="modifyCart(${item.id}, 1)" class="text-slate-300 font-bold text-xs">+</button>
                        </div>
                    </div>
                `;
            });

            if (keys.length === 0) {
                container.innerHTML = `<p class="text-center text-slate-500 py-16 text-sm">आपकी कार्ट अभी खाली है।</p>`;
            }

            document.getElementById('cart-count').innerText = totalCount;
            document.getElementById('cart-total').innerText = `₹${totalPrice}`;
        }

        function toggleCart() {
            document.getElementById('cart-drawer').classList.toggle('hidden');
        }

        function checkoutWhatsApp() {
            let keys = Object.keys(cartState);
            if (keys.length === 0) {
                alert('कृपया आर्डर भेजने से पहले कार्ट में उत्पाद जोड़ें!');
                return;
            }

            let message = "🛒 *New Direct Order - Harshit Chemical Industry*%0A%0A";
            let totalAmount = 0;
            keys.forEach(id => {
                let item = cartState[id];
                let subtotal = item.price * item.qty;
                totalAmount += subtotal;
                message += `• ${item.name} x ${item.qty} = ₹${subtotal}%0A`;
            });
            message += `%0A*Grand Total: ₹${totalAmount}*%0A%0Aकृपया मेरा यह आर्डर कन्फर्म करें।`;

            window.open(`https://wa.me/919691865574?text=${message}`, '_blank');
        }

        // Run application on load
        renderProducts();
    </script>
</body>
