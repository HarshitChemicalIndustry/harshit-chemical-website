<!DOCTYPE html>
<html lang="hi" class="h-full bg-slate-950 scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Harshit Chemical Industry | Luxury Direct Factory Store</title>
    
    <!-- Tailwind CSS Engine -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Leaflet Interactive Map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#ecfdf5',
                            100: '#d1fae5',
                            500: '#10b981',
                            600: '#059669',
                            700: '#047857',
                            800: '#065f46',
                            900: '#022c22',
                            950: '#011710'
                        },
                        gold: {
                            400: '#fbbf24',
                            500: '#f59e0b',
                            600: '#d97706'
                        }
                    }
                }
            }
        }
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap');
        
        * { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            -webkit-tap-highlight-color: transparent; 
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        #map { 
            height: 240px; 
            width: 100%; 
            border-radius: 1.25rem; 
            border: 1px solid rgba(255,255,255,0.1);
        }

        /* Dark Ultra-Premium Glassmorphism */
        .glass-panel {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .glass-card {
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.06) 0%, rgba(255, 255, 255, 0.02) 100%);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.5);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-card:hover {
            border-color: rgba(16, 185, 129, 0.5);
            box-shadow: 0 0 25px rgba(16, 185, 129, 0.25);
            transform: translateY(-3px);
        }

        .gold-badge {
            background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%);
        }

        .emerald-gradient {
            background: linear-gradient(135deg, #059669 0%, #022c22 100%);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen pb-36 relative overflow-x-hidden">

    <!-- Glowing Background Lights -->
    <div class="fixed inset-0 pointer-events-none z-0 overflow-hidden">
        <div class="absolute top-0 left-1/2 -translate-x-1/2 w-[30rem] h-[30rem] bg-emerald-900/20 rounded-full blur-[140px]"></div>
    </div>

    <!-- Main Content Container -->
    <div class="relative z-10">

        <!-- Top Navigation Header -->
        <header class="sticky top-0 z-40 glass-panel border-b border-slate-800 shadow-2xl w-full">
            <div class="max-w-md mx-auto px-4 py-3.5">
                <div class="flex items-center justify-between gap-3">
                    <div class="flex items-center gap-3">
                        <div class="w-12 h-12 rounded-2xl emerald-gradient flex items-center justify-center text-white font-black text-2xl shadow-[0_0_20px_rgba(16,185,129,0.4)] border border-emerald-400/30">
                            H
                        </div>
                        <div>
                            <div class="flex items-center gap-1.5 text-[9px] font-black tracking-widest text-emerald-400 uppercase mb-0.5">
                                <span class="gold-badge text-slate-950 px-2 py-0.5 rounded-full shadow-md flex items-center gap-1">
                                    <i class="fa-solid fa-crown text-[8px]"></i> DIRECT FACTORY
                                </span>
                            </div>
                            <h1 class="text-base font-black text-white leading-tight tracking-tight">Harshit Chemical</h1>
                            <button onclick="openMapModal()" class="text-xs text-slate-400 flex items-center gap-1 font-semibold truncate max-w-[200px] hover:text-emerald-400 transition-colors mt-0.5">
                                <i class="fa-solid fa-location-dot text-emerald-500"></i>
                                <span id="selected-address-text">Select Delivery Location</span>
                                <i class="fa-solid fa-chevron-down text-[9px] opacity-70"></i>
                            </button>
                        </div>
                    </div>
                    <button onclick="openAdminModal()" class="w-10 h-10 rounded-2xl bg-slate-900 border border-slate-800 flex items-center justify-center text-slate-300 hover:bg-emerald-600 hover:text-white transition-all shadow-lg">
                        <i class="fa-solid fa-sliders text-base"></i>
                    </button>
                </div>

                <!-- Glass Search Bar -->
                <div class="mt-3 relative">
                    <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                    <input type="text" id="search-input" onkeyup="renderProducts()" placeholder="Search Phenyl, Floor Cleaner, Brooms..." class="w-full pl-10 pr-4 py-2.5 bg-slate-900/90 border border-slate-800 rounded-2xl text-xs font-semibold text-slate-100 placeholder-slate-500 focus:outline-none focus:border-emerald-500 transition-all">
                </div>
            </div>
        </header>
