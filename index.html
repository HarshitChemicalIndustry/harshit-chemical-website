<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harshit Chemical Industry | Free E-Commerce</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="https://cloudflare.com">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="nav-container">
            <div class="logo"><i class="fas fa-flask"></i> Harshit Chemicals</div>
            <button class="cart-icon-btn" onclick="toggleCart()">
                <i class="fas fa-shopping-cart"></i>
                <span class="cart-count" id="global-cart-count">0</span>
            </button>
        </div>
    </header>

    <section class="hero">
        <h1>Harshit Chemical Industry</h1>
        <p>Premium Quality Housekeeping Products & Industrial Chemicals</p>
    </section>

    <main class="container">
        <h2 class="section-title">Our Premium Menu</h2>
        <div class="product-grid" id="products-container">
            <!-- Products mobile script se load honge -->
        </div>
    </main>

    <!-- Side Cart & Zomato Style Checkout Form -->
    <div class="cart-sidebar" id="cart-sidebar">
        <div class="cart-header">
            <h3><i class="fas fa-shopping-basket"></i> Your Cart</h3>
            <button class="close-cart" onclick="toggleCart()">&times;</button>
        </div>
        
        <div class="cart-items" id="cart-items-wrapper">
            <!-- Items yahan dikhenge -->
        </div>

        <!-- Customer Details Form (Zomato Style) -->
        <div class="checkout-form-container" style="border-top:1px solid #ddd; padding-top:15px; margin-top:15px;">
            <h4 style="margin-bottom:10px; color:#0056b3;">Delivery Details (Free Setup)</h4>
            <input type="text" id="cust-name" placeholder="Apna Naam Likhein" style="width:100%; padding:8px; margin-bottom:8px; border:1px solid #ccc; border-radius:4px;">
            <input type="text" id="cust-phone" placeholder="Mobile Number" style="width:100%; padding:8px; margin-bottom:8px; border:1px solid #ccc; border-radius:4px;">
            <textarea id="cust-address" placeholder="Pura Delivery Address bharein" rows="2" style="width:100%; padding:8px; margin-bottom:10px; border:1px solid #ccc; border-radius:4px; font-family:inherit;"></textarea>
        </div>

        <div class="cart-footer" style="border-top: 1px solid #ddd; padding-top: 15px;">
            <div style="display:flex; justify-content:space-between; font-weight:700; font-size:18px; margin-bottom:15px;">
                <span>Grand Total:</span>
                <span id="total-checkout-amount">₹0</span>
            </div>
            <a href="#" class="btn-whatsapp" onclick="triggerWhatsAppOrder(event)">
                <i class="fab fa-whatsapp"></i> Confirm & Order via WhatsApp
            </a>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Harshit Chemical Industry. All Rights Reserved.</p>
    </footer>

    <!-- Scripts Project files se link hain -->
    <script src="js/products-data.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
