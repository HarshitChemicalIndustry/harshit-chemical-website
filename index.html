    <!-- Application Logic -->

            { id: 43, name: "Room Freshener 5 Litre", category: "Chemicals", price: 550, image: "images/room_freshener_5litre.jpg" },
            { id: 44, name: "Room Spray", category: "Chemicals", price: 199, image: "images/room_spray.jpg" },

            { id: 46, name: "Scrubber Pad", category: "Cleaning Tools", price: 30, image: "images/scrubber_pad.jpg" },
            { id: 47, name: "Spider Duster", category: "Cleaning Tools", price: 210, image: "images/spider_duster.jpg" },
            { id: 48, name: "Sponge Mop", category: "Cleaning Tools", price: 350, image: "images/sponge_mop.jpg" },
            { id: 49, name: "Squeegee", category: "Brushes", price: 180, image: "images/squeegee.jpg" },
            { id: 50, name: "Stainless Steel Cleaner 5 Litre", category: "Chemicals", price: 490, image: "images/stainless_steel_cleaner_liquid_5litre.jpg" },
            { id: 51, name: "Stick Broom", category: "Cleaning Tools", price: 129, image: "images/stick_broom.jpg" },
            { id: 52, name: "Tiles Cleaner", category: "Chemicals", price: 199, image: "images/tiles_cleaner.jpg" },
            { id: 53, name: "Tiles Cleaner 5 Litre", category: "Chemicals", price: 480, image: "images/tiles_cleaner_5litre.jpg" },
            { id: 54, name: "Toilet Cleaner", category: "Chemicals", price: 139, image: "images/toilet_cleaner.jpg" },
            { id: 55, name: "Toilet Cleaner 5 Litre", category: "Chemicals", price: 460, image: "images/toilet_cleaner_5litre.jpg" },
            { id: 56, name: "Toilet Cleaner Applicator", category: "Brushes", price: 150, image: "images/toilet_cleaner_applicator.jpg" },
            { id: 57, name: "Cleaning Trolley", category: "Cleaning Tools", price: 1299, image: "images/trolley.jpg" },
            { id: 58, name: "Urinal Brush", category: "Brushes", price: 89, image: "images/urinal_brush.jpg" },
            { id: 59, name: "Wet Floor Sign", category: "Cleaning Tools", price: 250, image: "images/wet_floor_sign.jpg" },
            { id: 60, name: "White Phenyl 5 Litre", category: "Chemicals", price: 460, image: "images/white_phenyl_5litre.jpg" },
            { id: 61, name: "Window Wiper", category: "Brushes", price: 210, image: "images/window_wiper.jpg" }
        ];

        let cart = {};
        let currentCategory = 'All';

        function renderProducts(filterText = '', category = 'All') {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = '';
            
            let filtered = products.filter(p => {
                let matchesSearch = p.name.toLowerCase().includes(filterText.toLowerCase());
                let matchesCat = (category === 'All' || p.category === category);
                return matchesSearch && matchesCat;
            });

            document.getElementById('product-count').innerText = filtered.length;

            if(filtered.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-16 text-slate-500 font-medium">कोई उत्पाद नहीं मिला।</div>`;
                return;
            }

            filtered.forEach(p => {
                let qty = cart[p.id] ? cart[p.id].qty : 0;
                grid.innerHTML += `
                    <div class="bg-slate-800/90 rounded-2xl p-3 border border-slate-700/70 flex flex-col justify-between shadow-lg hover:border-emerald-500/50 transition">
                        <div>
                            <div class="relative bg-slate-900 rounded-xl overflow-hidden h-36 mb-3 flex items-center justify-center border border-slate-700/50">
                                <img src="${p.image}" alt="${p.name}" class="w-full h-full object-cover" onerror="this.src='images/banner.jpg'">
                            </div>
                            <h4 class="font-bold text-xs text-slate-200 line-clamp-2 h-8 leading-snug">${p.name}</h4>
                            <p class="text-[10px] text-emerald-400 font-medium mt-1 uppercase tracking-wider">${p.category}</p>
                        </div>
                        <div class="mt-3 pt-2 border-t border-slate-700/50">
                            <div class="flex items-center justify-between mb-2">
                                <span class="font-extrabold text-sm text-white">₹${p.price}</span>
                            </div>
                            ${qty === 0 ? `
                                <button onclick="updateQty(${p.id}, 1)" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs py-2.5 rounded-xl shadow transition">
                                    जोड़ें (Add)
                                </button>
                            ` : `
                                <div class="flex items-center justify-between bg-emerald-600 text-white rounded-xl px-2.5 py-1.5">
                                    <button onclick="updateQty(${p.id}, -1)" class="font-black text-sm px-1">-</button>
                                    <span class="text-xs font-black">${qty}</span>
                                    <button onclick="updateQty(${p.id}, 1)" class="font-black text-sm px-1">+</button>
                                </div>
                            `}
                        </div>
                    </div>
                `;
            });
        }

        function filterProducts() {
            let query = document.getElementById('search-input').value;
            renderProducts(query, currentCategory);
        }

        function filterCategory(cat) {
            currentCategory = cat;
            let buttons = document.querySelectorAll('.category-btn');
            buttons.forEach(b => {
                b.classList.remove('bg-emerald-600', 'text-white', 'shadow-md');
                b.classList.add('bg-slate-800', 'text-slate-300', 'border', 'border-slate-700');
            });
            event.target.classList.remove('bg-slate-800', 'text-slate-300', 'border', 'border-slate-700');
            event.target.classList.add('bg-emerald-600', 'text-white', 'shadow-md');
            renderProducts(document.getElementById('search-input').value, currentCategory);
        }

        function updateQty(id, change) {
            let product = products.find(p => p.id === id);
            if(!cart[id]) {
                if(change > 0) cart[id] = { ...product, qty: 1 };
            } else {
                cart[id].qty += change;
                if(cart[id].qty <= 0) delete cart[id];
            }
            updateCartUI();
            renderProducts(document.getElementById('search-input').value, currentCategory);
        }

        function updateCartUI() {
            let totalCount = 0, totalPrice = 0;
            let cartItemsContainer = document.getElementById('cart-items');
            cartItemsContainer.innerHTML = '';

            let keys = Object.keys(cart);
            keys.forEach(id => {
                let item = cart[id];
                totalCount += item.qty;
                totalPrice += item.price * item.qty;

                cartItemsContainer.innerHTML += `
                    <div class="flex items-center justify-between bg-slate-800/90 p-2.5 rounded-2xl border border-slate-700">
                        <div class="flex items-center space-x-3">
                            <img src="${item.image}" class="w-11 h-11 object-cover rounded-xl border border-slate-700">
                            <div>
                                <h5 class="text-xs font-bold text-slate-200 line-clamp-1">${item.name}</h5>
                                <p class="text-[11px] text-emerald-400 font-semibold">₹${item.price} × ${item.qty}</p>
                            </div>
                        </div>
                        <div class="flex items-center space-x-2 bg-slate-900 border border-slate-700 px-2.5 py-1 rounded-xl">
                            <button onclick="updateQty(${item.id}, -1)" class="text-slate-300 font-bold text-xs">-</button>
                            <span class="text-xs font-bold text-white">${item.qty}</span>
                            <button onclick="updateQty(${item.id}, 1)" class="text-slate-300 font-bold text-xs">+</button>
                        </div>
                    </div>
                `;
            });

            if(keys.length === 0) {
                cartItemsContainer.innerHTML = `<p class="text-center text-slate-500 py-16 text-sm">आपकी कार्ट खाली है।</p>`;
            }

            document.getElementById('cart-count').innerText = totalCount;
            document.getElementById('cart-total').innerText = `₹${totalPrice}`;
        }

        function toggleCart() {
            document.getElementById('cart-drawer').classList.toggle('hidden');
        }

        function checkoutWhatsApp() {
            let keys = Object.keys(cart);
            if(keys.length === 0) {
                alert('कृपया पहले कार्ट में कुछ उत्पाद जोड़ें!');
                return;
            }

            let msg = "🛒 *New Order - Harshit Chemical Industry*%0A%0A";
            let total = 0;
            keys.forEach(id => {
                let item = cart[id];
                let sub = item.price * item.qty;
                total += sub;
                msg += `• ${item.name} x ${item.qty} = ₹${sub}%0A`;
            });
            msg += `%0A*Total Amount: ₹${total}*%0A%0Aकृपया मेरा ऑर्डर कन्फर्म करें।`;

            window.open(`https://wa.me/919691865574?text=${msg}`, '_blank');
        }

        // Initialize execution
        renderProducts();
    </script>
</body>
</html>
