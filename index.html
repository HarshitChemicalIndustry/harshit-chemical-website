<!DOCTYPE html>

<head>

    <title>Harshit Chemical Industry | Premium Store</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Leaflet CSS for Map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dark: '#020617',
                        gold: '#fbbf24',
                        emerald: {
                            500: '#10b981',
                            600: '#059669',
                            900: '#064e3b',
                            950: '#022c22'
                        }
                    },
                    animation: {
                        'blob': 'blob 7s infinite',
                    },
                    keyframes: {
                        blob: {
                            '0%': { transform: 'translate(0px, 0px) scale(1)' },
                            '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
                            '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
                            '100%': { transform: 'translate(0px, 0px) scale(1)' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap');
        
        * { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        #map { height: 250px; width: 100%; border-radius: 1.5rem; border: 1px solid rgba(255,255,255,0.1); }

        /* Premium Glassmorphism UI */
        .glass-panel {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .glass-card {
            background: linear-gradient(145deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.01) 100%);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 24px -1px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
        }

        .glass-card:hover {
            border: 1px solid rgba(16, 185, 129, 0.4);
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.2);
            transform: translateY(-2px);
        }

        .gold-text {
            background: linear-gradient(to right, #fde047, #f59e0b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .gold-bg {
            background: linear-gradient(135deg, #f59e0b 0%, #b45309 100%);
        }
    </style>
</head>
<body class="text-slate-200 min-h-screen pb-36 relative overflow-x-hidden">

        <div class="absolute top-[20%] right-[-10%] w-96 h-96 bg-emerald-800/30 rounded-full mix-blend-screen filter blur-[100px] animate-blob animation-delay-2000"></div>
        <div class="absolute bottom-[-20%] left-[20%] w-96 h-96 bg-slate-800/50 rounded-full mix-blend-screen filter blur-[100px] animate-blob animation-delay-4000"></div>
    </div>

    <!-- Main Content Wrapper -->
    <div class="relative z-10">
        
        <!-- Header Section -->
        <header class="sticky top-0 z-40 glass-panel border-b border-slate-800 w-full">

                    <div class="flex items-center gap-3.5">

                            H
                        </div>
                        <div>
                            <div class="flex items-center gap-1.5 text-[9px] font-black tracking-widest uppercase mb-0.5">
                                <span class="gold-bg text-slate-950 px-2 py-0.5 rounded-full shadow-lg flex items-center gap-1">
                                    <i class="fa-solid fa-gem"></i> PREMIUM FACTORY

                            </div>

                    </button>

                <!-- Search Bar -->

    <!-- Map Modal -->

    </div>

                </h3>

    <!-- Checkout Modal -->

                <div>
                    <label class="block text-[10px] font-black text-slate-400 mb-1.5 uppercase tracking-widest">Mobile Number</label>

                </div>
                <div>
                    <label class="block text-[10px] font-black text-slate-400 mb-1.5 uppercase tracking-widest">Complete Address</label>
                    <textarea id="cust-address" required rows="2" class="w-full p-3.5 glass-card rounded-2xl text-sm font-bold text-white placeholder-slate-500 outline-none focus:border-emerald-500"></textarea>

                <div>
                    <label class="block text-[10px] font-black text-slate-400 mb-2 uppercase tracking-widest">Payment Method</label>
                    <div class="grid grid-cols-2 gap-3">
                        <label class="glass-card p-3.5 rounded-2xl flex items-center gap-2.5 cursor-pointer border-emerald-500/50 bg-emerald-900/20">

                        <label class="glass-card p-3.5 rounded-2xl flex items-center gap-2.5 cursor-pointer">

                            <span class="text-xs font-bold text-white">Cash (COD)</span>
                        </label>
                    </div>
                </div>
                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-extrabold py-4 rounded-2xl text-xs uppercase tracking-widest shadow-[0_0_20px_rgba(16,185,129,0.3)] mt-2 transition-all">Confirm Order on WhatsApp</button>
            </form>

            <div class="flex justify-between items-center border-b border-white/10 pb-4">
                <h3 class="font-extrabold text-lg text-white"><i class="fa-solid fa-gears text-emerald-500 mr-2"></i> Store Admin</h3>
                <button onclick="closeAdminModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-times text-xl"></i></button>
            </div>
            <div class="bg-slate-900/50 p-5 rounded-3xl space-y-3.5 border border-white/5 shadow-inner">
                <h4 class="font-black text-xs text-emerald-400 uppercase tracking-widest">Add New Product</h4>
                <input type="text" id="add-prod-name" placeholder="Product Name" class="w-full p-3 glass-card rounded-xl text-xs font-bold text-white">
                <div class="grid grid-cols-2 gap-3">
                    <input type="number" id="add-prod-price" placeholder="Price ₹" class="p-3 glass-card rounded-xl text-xs font-bold text-white">
                    <input type="number" id="add-prod-mrp" placeholder="MRP ₹" class="p-3 glass-card rounded-xl text-xs font-bold text-white">
                </div>
                <select id="add-prod-cat" class="w-full p-3 glass-card rounded-xl text-xs font-bold text-white [&>option]:bg-slate-900">
                    <option value="Chemicals">Chemicals</option>
                    <option value="Cleaning Tools">Cleaning Tools</option>
                    <option value="Dustbins & Bags">Dustbins & Bags</option>
                </select>
                <input type="file" id="add-prod-img-file" accept="image/*" class="text-xs w-full glass-card p-2.5 rounded-xl text-slate-300">
                <button onclick="saveNewProduct()" class="w-full bg-emerald-600 text-white font-extrabold py-3.5 rounded-xl text-xs uppercase tracking-widest hover:bg-emerald-500 transition-all">Save to Store</button>
            </div>
            <div id="admin-products-list" class="space-y-2.5 max-h-48 overflow-y-auto no-scrollbar"></div>
        </div>
    </div>

            { id: 39, name: "Wet Floor Sign", cat: "Cleaning Tools", price: 220, mrp: 320, img: "wet_floor_sign.jpg" }
        ];

        localStorage.clear();
        let products = productsList;
        let categories = ["All", "Chemicals", "Cleaning Tools", "Dustbins & Bags"];
        let currentCat = "All";
        let cart = {};
        let map, marker;
        let selectedLat = 28.6139, selectedLng = 77.2090;
        let selectedAddress = "Main Factory Store Address";

        function renderCategories() {
            document.getElementById('category-chips').innerHTML = categories.map(cat => `
                <button onclick="selectCategory('${cat}')" class="px-5 py-2.5 rounded-full text-xs font-black whitespace-nowrap transition-all duration-300 ${currentCat === cat ? 'bg-emerald-600 text-white shadow-[0_0_15px_rgba(16,185,129,0.4)] border-transparent' : 'glass-card text-slate-300 hover:text-white'}">
                    ${cat}
                </button>
            `).join('');
        }

        function selectCategory(cat) {
            currentCat = cat;
            document.getElementById('category-title').innerText = cat === 'All' ? 'All Products' : cat;
            renderCategories();
            renderProducts();
        }

        function renderProducts() {
            const container = document.getElementById('product-grid');
            const searchVal = document.getElementById('search-input').value.toLowerCase();
            
            let filtered = products.filter(p => (currentCat === 'All' || p.cat === currentCat) && p.name.toLowerCase().includes(searchVal));
            document.getElementById('product-count').innerText = `${filtered.length} Items`;

            if(!filtered.length) {
                container.innerHTML = `<div class="col-span-2 text-center py-10 text-slate-500 font-bold text-sm">No products found</div>`;
                return;
            }

            container.innerHTML = filtered.map(p => {
                let qty = cart[p.id] || 0;
                let discount = Math.round(((p.mrp - p.price) / p.mrp) * 100);
                return `
                    <div class="glass-card rounded-3xl p-3 flex flex-col justify-between relative group">
                        ${discount > 0 ? `<span class="absolute top-4 left-4 gold-bg text-slate-950 text-[9px] font-black px-2 py-0.5 rounded-full z-10 shadow-lg">${discount}% OFF</span>` : ''}
                        <div class="h-36 w-full flex items-center justify-center mb-2 overflow-hidden rounded-2xl bg-white/5 border border-white/5 relative">
                            <img src="${p.img}${cacheBuster}" alt="${p.name}" class="object-contain h-full w-full p-2 transform group-hover:scale-110 transition-transform duration-500" onerror="this.onerror=null; this.src='${fallbackImg}';">
                        </div>
                        <div class="mt-1 px-1">
                            <span class="text-[8px] font-black text-emerald-400 uppercase tracking-widest">${p.cat}</span>
                            <h4 class="font-bold text-sm text-white leading-tight line-clamp-2 mt-0.5">${p.name}</h4>
                            <div class="flex items-baseline gap-2 mt-1.5 mb-3">
                                <span class="font-black text-base text-gold">₹${p.price}</span>
                                ${p.mrp > p.price ? `<span class="text-[10px] text-slate-500 font-bold line-through">₹${p.mrp}</span>` : ''}
                            </div>
                        </div>
                        <div class="mt-auto">
                            ${qty === 0 ? `
                                <button onclick="addToCart(${p.id})" class="w-full glass-card text-emerald-400 font-extrabold text-xs py-2 rounded-xl hover:bg-emerald-600 hover:text-white hover:border-emerald-500 transition-all uppercase tracking-widest">Add</button>
                            ` : `
                                <div class="flex items-center justify-between bg-emerald-600 text-slate-950 rounded-xl py-1.5 px-3 font-black text-sm shadow-[0_0_15px_rgba(16,185,129,0.3)]">
                                    <button onclick="changeQty(${p.id}, -1)" class="w-6 h-6 flex items-center justify-center">-</button>
                                    <span class="text-white">${qty}</span>
                                    <button onclick="changeQty(${p.id}, 1)" class="w-6 h-6 flex items-center justify-center">+</button>
                                </div>
                            `}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function addToCart(id) { cart[id] = 1; updateCartUI(); renderProducts(); }
        function changeQty(id, delta) { cart[id] = (cart[id] || 0) + delta; if(cart[id] <= 0) delete cart[id]; updateCartUI(); renderProducts(); }

        function updateCartUI() {
            let totalQty = 0, totalPrice = 0;
            for(let id in cart) {
                let p = products.find(prod => prod.id == id);
                if(p) { totalQty += cart[id]; totalPrice += p.price * cart[id]; }
            }
            document.getElementById('cart-qty-badge').innerText = totalQty;
            document.getElementById('cart-total-price').innerText = totalPrice;
            document.getElementById('cart-final-total').innerText = totalPrice;
            
            const cartBar = document.getElementById('cart-bar');
            if(totalQty > 0) {
                cartBar.classList.remove('hidden');
                cartBar.classList.add('animate-[slideUp_0.3s_ease-out]');
            } else {
                cartBar.classList.add('hidden');
            }
        }

        function openCartModal() {
            document.getElementById('cart-items-container').innerHTML = Object.keys(cart).map(id => {
                let p = products.find(prod => prod.id == id);
                return `
                    <div class="flex items-center justify-between glass-card p-3 rounded-2xl">
                        <div class="flex items-center gap-3">
                            <img src="${p.img}" class="w-14 h-14 rounded-xl object-contain bg-white/5 p-1" onerror="this.src='${fallbackImg}'">
                            <div>
                                <h5 class="font-bold text-xs text-white">${p.name}</h5>
                                <div class="text-sm font-black gold-text mt-0.5">₹${p.price * cart[id]}</div>
                            </div>
                        </div>
                        <div class="flex items-center gap-3 bg-emerald-900/50 border border-emerald-500/30 text-white px-3 py-1.5 rounded-xl text-sm font-black">
                            <button onclick="changeQty(${p.id}, -1)" class="text-emerald-400 hover:text-white">-</button>
                            <span>${cart[id]}</span>
                            <button onclick="changeQty(${p.id}, 1)" class="text-emerald-400 hover:text-white">+</button>
                        </div>
                    </div>
                `;
            }).join('');
            document.getElementById('cart-modal').classList.remove('hidden');
        }

        function closeCartModal() { document.getElementById('cart-modal').classList.add('hidden'); }
        function openCheckoutModal() { closeCartModal(); document.getElementById('cust-address').value = selectedAddress; document.getElementById('checkout-modal').classList.remove('hidden'); }
        function closeCheckoutModal() { document.getElementById('checkout-modal').classList.add('hidden'); }

        function openMapModal() {
            document.getElementById('map-modal').classList.remove('hidden');
            setTimeout(() => {
                if(!map) {
                    map = L.map('map').setView([selectedLat, selectedLng], 13);
                    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                        subdomains: 'abcd',
                        maxZoom: 19
                    }).addTo(map);
                    marker = L.marker([selectedLat, selectedLng], {draggable: true}).addTo(map);
                    map.on('click', e => { marker.setLatLng(e.latlng); updateAddress(e.latlng.lat, e.latlng.lng); });
                }
            }, 200);
        }

        function updateAddress(lat, lng) {
            selectedLat = lat; selectedLng = lng;
            document.getElementById('modal-address-text').innerText = `Location (${lat.toFixed(4)}, ${lng.toFixed(4)})`;
            fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`)
                .then(r => r.json()).then(d => { if(d.display_name) { selectedAddress = d.display_name; document.getElementById('modal-address-text').innerText = selectedAddress; }});
        }

        function confirmLocation() {
            document.getElementById('selected-address-text').innerText = selectedAddress;
            closeMapModal();
        }

        function closeMapModal() { document.getElementById('map-modal').classList.add('hidden'); }

        function handleCheckoutSubmit(e) {
            e.preventDefault();
            const name = document.getElementById('cust-name').value;
            const phone = document.getElementById('cust-phone').value;
            const address = document.getElementById('cust-address').value;
            const payMode = document.querySelector('input[name="payment_mode"]:checked').value;

            let text = `*👑 PREMIUM ORDER - HARSHIT CHEMICAL INDUSTRY*%0A%0A*Name:* ${name}%0A*Phone:* ${phone}%0A*Address:* ${address}%0A*Payment:* ${payMode}%0A%0A*🛍️ ITEMS:*%0A`;
            let total = 0;
            for(let id in cart) {
                let p = products.find(prod => prod.id == id);
                text += `• ${p.name} x ${cart[id]} = ₹${p.price * cart[id]}%0A`;
                total += p.price * cart[id];
            }
            text += `%0A*💎 TOTAL AMOUNT:* ₹${total}`;
            window.open(`https://wa.me/?text=${text}`, '_blank');
            cart = {}; updateCartUI(); closeCheckoutModal();
        }

        function openAdminModal() { renderAdminList(); document.getElementById('admin-modal').classList.remove('hidden'); }
        function closeAdminModal() { document.getElementById('admin-modal').classList.add('hidden'); }

        function saveNewProduct() {
            const name = document.getElementById('add-prod-name').value;
            const price = parseFloat(document.getElementById('add-prod-price').value);
            const mrp = parseFloat(document.getElementById('add-prod-mrp').value) || price;
            const cat = document.getElementById('add-prod-cat').value;
            const imgFile = document.getElementById('add-prod-img-file').files[0];

            if(!name || !price) return alert('Enter Name & Price');

            const save = (img) => {
                products.push({ id: Date.now(), name, cat, price, mrp, img });
                renderProducts(); renderAdminList(); alert('Product Saved!');
            };

            if(imgFile) {
                const reader = new FileReader();
                reader.onload = e => save(e.target.result);
                reader.readAsDataURL(imgFile);
            } else {
                save("phenyl.jpg");
            }
        }

        function renderAdminList() {
            document.getElementById('admin-products-list').innerHTML = products.map(p => `
                <div class="flex items-center justify-between glass-card p-3 rounded-xl text-xs font-bold text-white mb-2">
                    <span>${p.name} (₹${p.price})</span>
                    <button onclick="removeProduct(${p.id})" class="text-red-400 hover:text-red-300 w-8 h-8 rounded-lg bg-red-900/30 flex items-center justify-center"><i class="fa-solid fa-trash"></i></button>
                </div>
            `).join('');
        }

        function removeProduct(id) {
            products = products.filter(p => p.id !== id);
            renderProducts(); renderAdminList(); updateCartUI();
        }

        // Add custom Tailwind Animation for Cart
        tailwind.config.theme.extend.keyframes.slideUp = {
            '0%': { transform: 'translateY(100%)', opacity: '0' },
            '100%': { transform: 'translateY(0)', opacity: '1' },
        }

        window.onload = function() { renderCategories(); renderProducts(); };
    </script>
</body>
</html>
