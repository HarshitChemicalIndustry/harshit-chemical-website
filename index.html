<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harshit Chemical Industry - Online Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 10px; }
        .hide-scroll::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-gray-50 font-sans text-gray-800 selection:bg-green-200">

    <!-- Navbar -->
    <nav class="bg-white sticky top-0 z-40 shadow-sm px-4 py-3 flex justify-between items-center">
        <div>
            <h1 class="text-xl font-black text-gray-900 tracking-tight">HARSHIT <span class="text-green-600">CHEMICAL</span></h1>
            <p class="text-xs text-gray-500">Industry & Cleaning Solutions</p>
        </div>
        <button onclick="openCart()" class="relative bg-gray-100 p-2 rounded-full hover:bg-gray-200 transition">
            <i class="fa-solid fa-cart-shopping text-gray-700 text-lg"></i>
            <span id="cartBadge" class="absolute -top-1 -right-1 bg-red-500 text-white text-[10px] font-bold w-5 h-5 flex items-center justify-center rounded-full border-2 border-white hidden">0</span>
        </button>
    </nav>

    <!-- Main Content -->
    <main class="max-w-md mx-auto md:max-w-4xl pt-4 px-4 pb-24" id="homePage">
        
        <!-- Search Bar -->
        <div class="relative mb-6">
            <i class="fa-solid fa-search absolute left-4 top-3 text-gray-400"></i>
            <input type="text" id="searchInput" onkeyup="searchProducts()" placeholder="Search cleaning products, chemicals..." class="w-full bg-white border border-gray-200 rounded-xl py-2.5 pl-10 pr-4 focus:outline-none focus:border-green-500 shadow-sm text-sm">
        </div>

        <!-- Categories -->
        <div class="flex space-x-3 overflow-x-auto hide-scroll mb-6 pb-2">
            <button onclick="filterCat('All', this)" class="cat-btn bg-green-600 text-white px-5 py-1.5 rounded-full text-sm font-medium whitespace-nowrap shadow-md">All</button>
            <button onclick="filterCat('Chemicals', this)" class="cat-btn bg-white border border-gray-200 text-gray-600 px-5 py-1.5 rounded-full text-sm font-medium whitespace-nowrap">Chemicals & Phenyl</button>
            <button onclick="filterCat('Cleaning Tools', this)" class="cat-btn bg-white border border-gray-200 text-gray-600 px-5 py-1.5 rounded-full text-sm font-medium whitespace-nowrap">Tools & Wipers</button>
        </div>

        <!-- Products List -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4" id="productList">
            <!-- Products will load here -->
        </div>
    </main>

    <!-- Checkout / Cart Page -->
    <div id="checkoutPage" class="fixed inset-0 bg-[#0a0f0a] text-white z-50 hidden flex-col overflow-y-auto">
        <div class="sticky top-0 bg-[#0a0f0a] px-4 py-4 flex items-center border-b border-gray-800 z-10">
            <button onclick="closeCart()" class="text-white mr-4"><i class="fa-solid fa-arrow-left text-xl"></i></button>
            <h2 class="text-xl font-bold">My Cart</h2>
        </div>

        <div class="px-4 py-6 max-w-md mx-auto w-full">
            <div id="cartItemsList" class="space-y-4 mb-8"></div>

            <div class="bg-[#141a14] rounded-2xl p-5 mb-6 border border-gray-800">
                <h3 class="text-gray-400 text-xs font-bold uppercase tracking-wider mb-4">Order Summary</h3>
                <div class="flex justify-between text-sm mb-2">
                    <span class="text-gray-400">Sub-Total</span>
                    <span id="subTotal">₹0</span>
                </div>
                <div class="flex justify-between text-sm mb-4 border-b border-gray-800 pb-4">
                    <span class="text-gray-400">Delivery Charge</span>
                    <span class="text-green-500 font-medium">FREE</span>
                </div>
                <div class="flex justify-between font-bold text-lg">
                    <span>Total Cost</span>
                    <span id="totalCost" class="text-green-400">₹0</span>
                </div>
            </div>

            <div class="bg-[#141a14] rounded-2xl p-5 mb-6 border border-gray-800">
                <h3 class="text-gray-400 text-xs font-bold uppercase tracking-wider mb-4">Delivery Address</h3>
                <textarea id="address" placeholder="Enter your full address and pincode..." class="w-full bg-[#0a0f0a] border border-gray-700 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-green-500" rows="3"></textarea>
            </div>

            <div class="bg-[#141a14] rounded-2xl p-5 mb-24 border border-gray-800">
                <h3 class="text-gray-400 text-xs font-bold uppercase tracking-wider mb-4">Payment Method</h3>
                
                <label class="flex items-center justify-between p-4 mb-3 rounded-xl border border-green-500 bg-green-900/20 cursor-pointer payment-option">
                    <div class="flex items-center">
                        <i class="fa-solid fa-building-columns text-green-500 text-xl w-8"></i>
                        <div>
                            <p class="font-bold text-sm">Online Payment</p>
                            <p class="text-xs text-gray-400">Cards, UPI, Wallets</p>
                        </div>
                    </div>
                    <input type="radio" name="payment" value="online" checked class="w-5 h-5 accent-green-500">
                </label>

                <label class="flex items-center justify-between p-4 rounded-xl border border-gray-700 bg-[#0a0f0a] cursor-pointer payment-option">
                    <div class="flex items-center">
                        <i class="fa-solid fa-money-bill-1-wave text-gray-400 text-xl w-8"></i>
                        <div>
                            <p class="font-bold text-sm">Cash on Delivery</p>
                            <p class="text-xs text-gray-400">Pay when delivered</p>
                        </div>
                    </div>
                    <input type="radio" name="payment" value="cod" class="w-5 h-5 accent-green-500">
                </label>
            </div>
        </div>

        <div class="fixed bottom-0 left-0 w-full bg-[#141a14] border-t border-gray-800 p-4 flex justify-between items-center z-20">
            <div>
                <p class="text-gray-400 text-xs">Total Payable</p>
                <p id="bottomTotal" class="text-xl font-bold text-white">₹0</p>
            </div>
            <button onclick="placeOrder()" class="bg-green-600 hover:bg-green-500 text-white px-8 py-3 rounded-xl font-bold flex items-center shadow-lg shadow-green-900/50 transition">
                Place Order <i class="fa-solid fa-arrow-right ml-2"></i>
            </button>
        </div>
    </div>

    <!-- Script -->
    <script>
        const products = [
            { id: 1, name: "Phenyl (5 Litre)", category: "Chemicals", price: 350, unit: "5 Ltr", img: "images/phenyl.jpg" },
            { id: 2, name: "White Phenyl (5 Litre)", category: "Chemicals", price: 380, unit: "5 Ltr", img: "images/white_phenyl_5_litre.jpg" },
            { id: 3, name: "Toilet Cleaner", category: "Chemicals", price: 120, unit: "1 Ltr", img: "images/toilet_cleaner.jpg" },
            { id: 4, name: "Toilet Cleaner (5 Litre)", category: "Chemicals", price: 450, unit: "5 Ltr", img: "images/toilet_cleaner_5_litre.jpg" },
            { id: 5, name: "Glass Cleaner", category: "Chemicals", price: 150, unit: "500 ml", img: "images/glass_cleaner.jpg" },
            { id: 6, name: "Floor Cleaner", category: "Chemicals", price: 200, unit: "1 Ltr", img: "images/floor_cleaner.jpg" },
            { id: 7, name: "Dish Wash Liquid", category: "Chemicals", price: 110, unit: "1 Ltr", img: "images/dish_wash.jpg" },
            { id: 8, name: "Car & Bike Shampoo", category: "Chemicals", price: 250, unit: "1 Ltr", img: "images/car_bike_shampoo.jpg" },
            { id: 9, name: "Room Freshener (5 Litre)", category: "Chemicals", price: 600, unit: "5 Ltr", img: "images/room_freshener_5_litre.jpg" },
            { id: 10, name: "21 Inch Floor Wiper", category: "Cleaning Tools", price: 220, unit: "1 Pc", img: "images/21_inch_floor_wiper.jpg" },
            { id: 11, name: "Plastic Storage Bucket", category: "Cleaning Tools", price: 300, unit: "1 Pc", img: "images/multipurpose_plastic_storage_bucket_drum.jpg" },
            { id: 12, name: "Floor Brush", category: "Cleaning Tools", price: 140, unit: "1 Pc", img: "images/floor_brush.jpg" },
            { id: 13, name: "Toilet Brush", category: "Cleaning Tools", price: 90, unit: "1 Pc", img: "images/toilet_brush.jpg" },
            { id: 14, name: "Microfiber Cloth", category: "Cleaning Tools", price: 60, unit: "1 Pc", img: "images/microfiber_cloth.jpg" },
            { id: 15, name: "Dustbin Large", category: "Cleaning Tools", price: 450, unit: "1 Pc", img: "images/dustbin_large.jpg" }
        ];

        let cart = [];

        function loadProducts(items) {
            const list = document.getElementById('productList');
            list.innerHTML = '';
            if(items.length === 0) {
                list.innerHTML = `<p class="text-gray-500 col-span-2 text-center py-8">No products found.</p>`;
                return;
            }
            items.forEach(p => {
                list.innerHTML += `
                    <div class="bg-white p-3 rounded-2xl shadow-sm border border-gray-100 flex gap-4 items-center">
                        <img src="${p.img}" onerror="this.src='https://images.unsplash.com/photo-1584438784894-089d6a62b8fa?w=300&q=80'" class="w-24 h-24 object-cover rounded-xl bg-gray-50">
                        <div class="flex-1">
                            <h3 class="font-bold text-gray-800 text-sm">${p.name}</h3>
                            <p class="text-[10px] text-gray-500 mb-2">Harshit Chemical Industry</p>
                            <div class="flex justify-between items-center">
                                <div>
                                    <span class="bg-green-100 text-green-700 text-[10px] px-2 py-0.5 rounded font-bold">${p.unit}</span>
                                    <p class="font-black text-gray-900 mt-1">₹${p.price}</p>
                                </div>
                                <button onclick="addToCart(${p.id})" class="bg-green-50 text-green-600 border border-green-200 px-4 py-1.5 rounded-lg text-sm font-bold hover:bg-green-600 hover:text-white transition">
                                    ADD
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function filterCat(cat, btn) {
            document.querySelectorAll('.cat-btn').forEach(b => {
                b.classList.remove('bg-green-600', 'text-white', 'shadow-md');
                b.classList.add('bg-white', 'border', 'border-gray-200', 'text-gray-600');
            });
            btn.classList.remove('bg-white', 'border', 'border-gray-200', 'text-gray-600');
            btn.classList.add('bg-green-600', 'text-white', 'shadow-md');

            if(cat === 'All') {
                loadProducts(products);
            } else {
                const filtered = products.filter(p => p.category === cat);
                loadProducts(filtered);
            }
        }

        function searchProducts() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = products.filter(p => p.name.toLowerCase().includes(query));
            loadProducts(filtered);
        }

        function addToCart(id) {
            const product = products.find(p => p.id === id);
            const existing = cart.find(item => item.id === id);
            if(existing) {
                existing.qty += 1;
            } else {
                cart.push({ ...product, qty: 1 });
            }
            updateCartData();
        }

        function updateCartData() {
            const count = cart.reduce((sum, item) => sum + item.qty, 0);
            const badge = document.getElementById('cartBadge');
            if(count > 0) {
                badge.innerText = count;
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }
            renderCartPage();
        }

        function renderCartPage() {
            const list = document.getElementById('cartItemsList');
            let total = 0;
            list.innerHTML = '';
            if(cart.length === 0) {
                list.innerHTML = `<p class="text-gray-500 text-center py-4">Your cart is empty.</p>`;
            } else {
                cart.forEach((item, index) => {
                    const itemTotal = item.price * item.qty;
                    total += itemTotal;
                    list.innerHTML += `
                        <div class="flex items-center gap-4 bg-[#141a14] p-3 rounded-2xl border border-gray-800">
                            <img src="${item.img}" class="w-16 h-16 object-cover rounded-xl">
                            <div class="flex-1">
                                <h4 class="font-bold text-sm">${item.name}</h4>
                                <p class="text-xs text-gray-400">${item.unit}</p>
                                <p class="font-bold text-green-400 mt-1">₹${itemTotal}</p>
                            </div>
                            <div class="flex items-center bg-[#0a0f0a] rounded-lg border border-gray-700">
                                <button onclick="changeQty(${index}, -1)" class="px-3 py-1 text-gray-400">-</button>
                                <span class="font-bold text-sm w-4 text-center">${item.qty}</span>
                                <button onclick="changeQty(${index}, 1)" class="px-3 py-1 text-green-500">+</button>
                            </div>
                        </div>
                    `;
                });
            }
            document.getElementById('subTotal').innerText = `₹${total}`;
            document.getElementById('totalCost').innerText = `₹${total}`;
            document.getElementById('bottomTotal').innerText = `₹${total}`;
        }

        function changeQty(index, change) {
            cart[index].qty += change;
            if(cart[index].qty <= 0) {
                cart.splice(index, 1);
            }
            updateCartData();
        }

        function openCart() {
            document.getElementById('homePage').style.display = 'none';
            document.getElementById('checkoutPage').classList.remove('hidden');
            document.getElementById('checkoutPage').classList.add('flex');
            window.scrollTo(0,0);
        }

        function closeCart() {
            document.getElementById('homePage').style.display = 'block';
            document.getElementById('checkoutPage').classList.add('hidden');
            document.getElementById('checkoutPage').classList.remove('flex');
        }

        document.querySelectorAll('input[name="payment"]').forEach(radio => {
            radio.addEventListener('change', function() {
                document.querySelectorAll('.payment-option').forEach(el => {
                    el.classList.remove('border-green-500', 'bg-green-900/20');
                    el.classList.add('border-gray-700', 'bg-[#0a0f0a]');
                });
                if(this.checked) {
                    this.parentElement.classList.remove('border-gray-700', 'bg-[#0a0f0a]');
                    this.parentElement.classList.add('border-green-500', 'bg-green-900/20');
                }
            });
        });

        function placeOrder() {
            if(cart.length === 0) {
                alert("Please add products to your cart first!");
                return;
            }
            const address = document.getElementById('address').value;
            if(!address) {
                alert("Please enter your delivery address.");
                return;
            }
            const paymentMethod = document.querySelector('input[name="payment"]:checked').value;
            if(paymentMethod === 'online') {
                alert("Redirecting to Secure Online Payment Gateway...");
            } else {
                alert("Order Placed Successfully via Cash on Delivery!");
                cart = [];
                updateCartData();
                closeCart();
            }
        }
        loadProducts(products);
    </script>
</body>
</html>
