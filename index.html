<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harshit Chemical Industry | Quick Order</title>
    <!-- Tailwind CSS (Direct Website Style Ke Liye) -->
    <script src="https://tailwindcss.com"></script>
    <style>
        .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    </style>
</head>
<body class="bg-gray-50 font-sans text-gray-800 pb-24">

    <!-- 1. TOP STICKY HEADER -->
    <header class="sticky top-0 z-50 bg-white border-b border-gray-100 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between gap-4">
            <div>
                <span class="text-xl font-extrabold text-green-600">Harshit</span>
                <span class="text-xl font-extrabold text-amber-500">Chemicals</span>
            </div>
            <!-- Live Search Bar -->
            <div class="flex-1 max-w-xl relative">
                <input
                    type="text"
                    id="searchBar"
                    oninput="filterProducts()"
                    placeholder='Search "Phenyl", "Wiper", "Mop"...'
                    class="w-full bg-gray-50 border border-gray-200 rounded-xl py-2 px-4 pl-10 text-sm focus:outline-none focus:ring-2 focus:ring-green-500 focus:bg-white text-gray-800"
                />
                <span class="absolute left-3 top-2 text-gray-400">🔍</span>
            </div>
            <!-- Cart Button -->
            <button onclick="toggleCart()" class="bg-green-600 text-white font-bold px-4 py-2 rounded-xl flex items-center gap-2 hover:bg-green-700 transition">
                <span>🛒</span>
                <span id="cartBtnCount">Cart (0)</span>
            </button>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-6">
        <!-- 2. HERO BANNER -->
        <div class="bg-gradient-to-r from-green-600 to-emerald-700 rounded-2xl p-6 text-white mb-6 shadow-sm">
            <span class="bg-white/20 text-[10px] font-bold px-2 py-0.5 rounded-full uppercase tracking-wider">Official Store</span>
            <h1 class="text-2xl font-black mt-1">Harshit Chemical Industry</h1>
            <p class="text-green-50 text-xs mt-0.5">High-quality cleaning chemical products delivered instantly via WhatsApp.</p>
        </div>

        <!-- 3. PRODUCT GRID -->
        <h2 class="text-lg font-extrabold text-gray-800 mb-4 flex items-center gap-2">⚡ Our Products</h2>
        <div id="productGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3">
            <!-- Products automatically JavaScript se yahan load honge -->
        </div>
    </main>

    <!-- 4. FLOATING BOTTOM CART BAR -->
    <div id="floatingCart" class="fixed bottom-4 left-4 right-4 max-w-md mx-auto bg-green-600 text-white p-3 rounded-xl flex items-center justify-between shadow-xl z-40 hidden">
        <div class="text-xs">
            <p id="floatingCount" class="font-bold">0 Items Added</p>
            <p id="floatingTotal" class="text-green-100 font-medium">Total: ₹0</p>
        </div>
        <button onclick="toggleCart()" class="bg-white text-green-700 font-bold text-xs uppercase px-4 py-2 rounded-lg">
            View Cart 🛍️
        </button>
    </div>

    <!-- 5. SLIDING CART DRAWER OVERLAY -->
    <div id="cartOverlay" onclick="toggleCart()" class="fixed inset-0 bg-black/40 z-50 hidden transition-opacity"></div>
    
    <!-- CART DRAWER PANEL -->
    <div id="cartDrawer" class="fixed bottom-0 left-0 right-0 max-w-xl mx-auto bg-white rounded-t-2xl shadow-2xl z-50 border-t p-4 flex flex-col max-h-[80vh] translate-y-full transition-transform duration-300">
        <div class="flex items-center justify-between pb-3 border-b">
            <h2 class="text-base font-bold text-gray-800 flex items-center gap-2">🛍️ Your Cart</h2>
            <button onclick="toggleCart()" class="text-gray-400 font-bold p-1">✕</button>
        </div>
        <!-- Items List -->
        <div id="cartItemsList" class="overflow-y-auto flex-1 py-4 space-y-3">
            <!-- Items yahan dikhenge -->
        </div>
        <!-- Checkout Section -->
        <div class="pt-3 border-t bg-white">
            <div class="flex justify-between items-center mb-3">
                <span class="text-sm font-medium text-gray-600">Grand Total</span>
                <span id="cartGrandTotal" class="text-lg font-black text-gray-900">₹0</span>
            </div>
            <button onclick="sendWhatsAppOrder()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-xl flex items-center justify-center gap-2 text-sm shadow-md transition">
                <span>💬</span> Order via WhatsApp
            </button>
        </div>
    </div>

    <!-- 6. JAVASCRIPT (Sabhi Products Data aur Automation Logic) -->
    <script>
        // 📞 YAHAN APNA WHATSAPP NUMBER DALIE (Bina '+' ke, jaise: 919999999999)
        const WHATSAPP_NUMBER = "919999999999"; 

        const BASE_IMAGE_URL = "https://githubusercontent.com";

        // Aapke repo ki images ke mutabiq exact product list aur market rate
        const products = [
            { id: 1, name: "21 Inch Floor Wiper", price: 240, category: "Wiper", image: "21-inch-floor-wiper.jpg" },
            { id: 2, name: "Multipurpose Plastic Storage Bucket Drum", price: 450, category: "Bucket & Tub", image: "Multipurpose_plastic_storage_bucket_drum.jpg" },
            { id: 3, name: "Bathroom Cleaner", price: 120, category: "Cleaners", image: "bathroom_cleaner.jpg" },
            { id: 4, name: "Black Phenyl 5 Litre", price: 349, category: "Chemicals", image: "black_phenyl_5_litre.jpg" },
            { id: 5, name: "Broom & Dustpan Set", price: 199, category: "Tools", image: "broom_%26_dustpan_set.jpg" },
            { id: 6, name: "Dish Wash 5 Litre", price: 399, category: "Chemicals", image: "dishwash_5liter.jpg" },
            { id: 7, name: "Floor Cleaner 5 Litre", price: 350, category: "Chemicals", image: "floor_cleaner_5liter.png" },
            { id: 8, name: "Glass Cleaner 5 Litre", price: 280, category: "Chemicals", image: "glass_cleaner_5_litre.jpg" },
            { id: 9, name: "Hand Wash 5 Litre", price: 450, category: "Chemicals", image: "handwash_5liter.jpg" },
            { id: 10, name: "Machine Cleaner 5 Litre", price: 599, category: "Chemicals", image: "machine_cleaner_5_litre.jpg" },
            { id: 11, name: "Microfiber Cloth", price: 80, category: "Tools", image: "microfiber_cloth.jpg" },
            { id: 12, name: "Microfiber Spin Mop", price: 899, category: "Tools", image: "microfiber_spin_mop.jpg" },
            { id: 13, name: "Toilet Cleaner 5 Litre", price: 320, category: "Chemicals", image: "toilet_cleaner_5_litre.jpg" },
            { id: 14, name: "White Phenyl 5 Litre", price: 299, category: "Chemicals", image: "white_phenyl_5_litre.jpg" },
            { id: 15, name: "Window Wiper", price: 130, category: "Wiper", image: "window_wiper.jpg" }
        ];

        let cart = {};

        // Screen par saare items dikhane ke liye function
        function renderProducts(productsToRender) {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = '';
            
            productsToRender.forEach(product => {
                const qty = cart[product.id] ? cart[product.id].quantity : 0;
                const buttonHTML = qty > 0 ? `
                    <div class="flex items-center bg-green-600 text-white rounded-lg font-bold text-xs overflow-hidden">
                        <button onclick="updateCart(${product.id}, -1)" class="px-2 py-1.5 hover:bg-green-700">-</button>
                        <span class="px-2">${qty}</span>
                        <button onclick="updateCart(${product.id}, 1)" class="px-2 py-1.5 hover:bg-green-700">+</button>
                    </div>
                ` : `
                    <button onclick="updateCart(${product.id}, 1)" class="border border-green-600 text-green-600 hover:bg-green-50 font-bold text-xs uppercase px-3 py-1.5 rounded-lg transition-all">Add</button>
                `;

                grid.innerHTML += `
                    <div class="bg-white border border-gray-100 rounded-xl p-2.5 flex flex-col justify-between shadow-sm product-card" data-name="${product.name.toLowerCase()}">
                        <div class="w-full h-28 bg-gray-50 rounded-lg overflow-hidden mb-2 flex items-center justify-center">
                            <img src="${BASE_IMAGE_URL + product.image}" alt="${product.name}" class="max-h-full max-w-full object-contain p-1" onerror="this.src='https://placehold.co'">
                        </div>
                        <div>
                            <span class="text-[9px] font-bold text-gray-400 bg-gray-100 px-1.5 py-0.5 rounded-full uppercase">${product.category}</span>
                            <h3 class="text-xs font-semibold text-gray-800 mt-0.5 line-clamp-2 h-8">${product.name}</h3>
                        </div>
                        <div class="flex items-center justify-between mt-2 pt-1.5 border-t border-gray-50">
                            <span class="text-sm font-bold text-gray-900">₹${product.price}</span>
                            <div id="btn-container-${product.id}">${buttonHTML}</div>
                        </div>
                    </div>
                `;
            });
        }

        // Live Search Filter Function
        function filterProducts() {
            const query = document.getElementById('searchBar').value.toLowerCase();
            const filtered = products.filter(p => p.name.toLowerCase().includes(query));
            renderProducts(filtered);
        }

        // Jhola (Cart) automatic manage karne ka tarika
